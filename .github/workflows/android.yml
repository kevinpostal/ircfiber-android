name: android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ubuntu-latest ships the SDK at $ANDROID_SDK_ROOT; android-actions/setup-android@v3 fails on the
      # preview-license prompt of the newer sdkmanager, so accept licenses and install directly.
      - name: Install SDK components
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.2" "build-tools;36.0.0"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}

      # Instrumented (UI) tests stay out of CI; they run locally through TestLab (`make uitest…`).
      - name: Build + JVM unit tests
        run: ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest

      # Keep each debug APK one day (re-run the workflow for an older commit): artifact storage fills up at the
      # default 90-day retention.
      - uses: actions/upload-artifact@v4
        with:
          name: fiberirc-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
